[project]
name = "rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asif Khan", email = "asifkhan882609@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.11",
    "openai>=3.35.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-eval = "rag_eval:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
